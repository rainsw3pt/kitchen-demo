<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Studio — кухни на заказ и дизайн-проекты</title>
  <style>
    :root {
      --accent: #b07d4f;
      --dark: #2b2b2b;
      --bg: #f7f4f0;
      --card: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--dark);
    }

    
    header {
      background: var(--dark);
      color: #fff;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo {
      font-size: 26px;
      letter-spacing: 2px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .logo span { color: var(--accent); }
    header nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      opacity: .85;
    }
    header nav a:hover { opacity: 1; color: var(--accent); }

  
    .hero {
      background-image: url("images/33211f18e66e11f18daba2d9c9abc235_1.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(20, 18, 15, .55);
    }
    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 640px;
      padding: 120px 5%;
    }
    .hero__title {
      font-size: 44px;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, .6);
      margin-bottom: 24px;
    }
    .hero__subtitle {
      font-size: 20px;
      color: #efe9e2;
      margin-bottom: 48px;
    }
    .hero__title--sub {
      font-size: 26px;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 16px;
    }
    .hero__title--sub::after {
      content: "";
      display: block;
      width: 64px;
      height: 3px;
      margin-top: 10px;
      border-radius: 2px;
      background: var(--accent);
    }
    .hero__list {
      list-style: none;
      font-size: 20px;
      line-height: 1.5;
      color: #efe9e2;
    }
    .hero__list li {
      padding: 16px 0;
      border-bottom: 1px solid rgba(176, 125, 79, .45);
    }
    .hero__list li:last-child { border-bottom: none; }
    .hero__list li::before {
      content: "—";
      color: var(--accent);
      margin-right: 12px;
      font-weight: 700;
    }

    
    footer {
      background: var(--dark);
      color: #ccc;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header { justify-content: center; text-align: center; }
      .hero__title { font-size: 32px; }
      .hero__subtitle { font-size: 17px; }
      .hero__list { font-size: 17px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Kitchen<span>Studio</span></a>
    <nav>
      <a href="catalog.html">Каталог кухонь</a>
      <a href="design.html">Дизайн-проект</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero__content">
        <h1 class="hero__title">Кухни на заказ с дизайнерским подходом</h1>
        <p class="hero__subtitle">Спроектируем и соберём кухню, которая будет удобной именно для вас.</p>
        <h2 class="hero__title hero__title--sub">Почему именно мы?</h2>
        <ul class="hero__list">
          <li>Удобство и простота</li>
          <li>Индивидуальный подход</li>
          <li>Самые выгодные предложения на рынке</li>
        </ul>
      </div>
    </section>
  </main>

  <footer id="contacts">
    РАБОТА ДЛЯ ПОРТФОЛИО №1
  </footer>

</body>
</html>
